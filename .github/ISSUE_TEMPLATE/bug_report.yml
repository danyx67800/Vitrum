name: Bug report
description: Report a reproducible problem with Vitrum
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for testing Vitrum. Please describe the problem precisely; TV model and Android/Fire OS version matter a lot.
  - type: input
    id: device
    attributes:
      label: Device and OS
      description: Fire TV Stick model or Android TV/Google TV device, plus Fire OS/Android version.
      placeholder: Fire TV Stick 4K Max (Fire OS 8) / Chromecast with Google TV (Android 12)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vitrum version
      description: Shown in Settings → About, for example 1.0.1.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Move focus to ...
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and logs
      description: Include logcat if available (adb logcat -s AndroidRuntime).
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
