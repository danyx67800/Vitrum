name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/vitrum-release.jks
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"

      - name: Build signed release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/vitrum-release.jks
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon :app:assembleRelease -PversionName="$VERSION"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/Vitrum-v${VERSION}.apk"
          cd release
          sha256sum "Vitrum-v${VERSION}.apk" > "Vitrum-v${VERSION}.apk.sha256"
          ls -lh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "release/Vitrum-v${VERSION}.apk" \
            "release/Vitrum-v${VERSION}.apk.sha256" \
            --title "Vitrum ${VERSION}" \
            --generate-notes
